[project]
name = "lankalux-agents"
version = "0.1.0"
description = "LankaLux AI General Manager and specialist agents (runs on the Oracle VM)"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lankalux-agents = "lankalux_agents.worker:main"
lankalux-bench = "lankalux_agents.bench:main"
lankalux-testdrive = "lankalux_agents.testdrive:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lankalux_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
